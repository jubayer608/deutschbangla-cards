<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 72" role="img" aria-label="Ulluk — বাংলায় জার্মান শেখো">
  <defs>
    <linearGradient id="ulluk-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Ulluk owl mark (refined from the v5 mascot) -->
  <g>
    <!-- ear tufts -->
    <path d="M15 24 L10 7 L29 15 Z" fill="#047857"/>
    <path d="M53 24 L58 7 L39 15 Z" fill="#047857"/>
    <!-- head -->
    <circle cx="34" cy="39" r="27" fill="url(#ulluk-body)"/>
    <!-- eyes -->
    <ellipse cx="24" cy="37" rx="8.5" ry="10" fill="#ffffff"/>
    <ellipse cx="44" cy="37" rx="8.5" ry="10" fill="#ffffff"/>
    <circle cx="24" cy="39" r="4" fill="#064e3b"/>
    <circle cx="44" cy="39" r="4" fill="#064e3b"/>
    <circle cx="25.5" cy="37" r="1.3" fill="#ffffff"/>
    <circle cx="45.5" cy="37" r="1.3" fill="#ffffff"/>
    <!-- beak -->
    <path d="M29 47 L39 47 L34 53 Z" fill="#f59e0b"/>
  </g>
  <!-- wordmark -->
  <text x="74" y="51" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5" fill="#064e3b">Ulluk</text>
</svg>
