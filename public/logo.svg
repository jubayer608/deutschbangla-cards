<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Ulluk — Learn German. Stay Weird.">
  <!-- Ulluk owl mark (navy body, cream face, amber eyes, orange beak) -->
  <g>
    <!-- spark accents -->
    <path d="M6 44 L12 48 M4 58 L12 58" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- ear tufts -->
    <path d="M22 34 L16 14 L36 24 Z" fill="#0B1F3B"/>
    <path d="M74 34 L80 14 L60 24 Z" fill="#0B1F3B"/>
    <!-- head -->
    <circle cx="48" cy="52" r="34" fill="#0B1F3B"/>
    <!-- graduation cap -->
    <path d="M48 6 L82 18 L48 30 L14 18 Z" fill="#16345E"/>
    <path d="M72 22 C 78 26 82 30 84 34" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="84" cy="37" r="3" fill="#FBBF24"/>
    <!-- cream face -->
    <path d="M48 82 C 30 74 18 62 18 48 C 18 34 32 26 48 26 C 64 26 78 34 78 48 C 78 62 66 74 48 82 Z" fill="#FFF7E6"/>
    <!-- eyes -->
    <circle cx="36" cy="50" r="11" fill="#FBBF24"/>
    <circle cx="60" cy="50" r="11" fill="#FBBF24"/>
    <circle cx="36" cy="51" r="5.5" fill="#0B1F3B"/>
    <circle cx="60" cy="51" r="5.5" fill="#0B1F3B"/>
    <circle cx="38" cy="48" r="1.8" fill="#ffffff"/>
    <circle cx="62" cy="48" r="1.8" fill="#ffffff"/>
    <!-- beak -->
    <path d="M43 62 L53 62 L48 70 Z" fill="#F59E0B"/>
  </g>
  <!-- wordmark -->
  <text x="98" y="64" font-family="Poppins, Nunito, 'Arial Rounded MT Bold', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="#0B1F3B">ULLUK</text>
  <!-- yellow swoosh inside the U -->
  <path d="M106 48 Q114 58 124 44" stroke="#FBBF24" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- spark accents by the K -->
  <path d="M262 14 L268 24 M280 10 L280 22 M296 16 L288 24" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
